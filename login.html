<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar — Sistema de Gestão da Igreja</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

    <div class="tela-publica">
        <div class="card-auth">

            <div class="auth-logo">
                <i class="fa-solid fa-church"></i>
                <h1>Igreja</h1>
            </div>

            <h2 class="auth-titulo">Entrar</h2>

            <form id="form-login" novalidate>

                <div class="campo">
                    <label for="email" class="obrigatorio">E-mail</label>
                    <input type="email" id="email" name="email" required placeholder="nome@email.com">
                </div>

                <div class="campo">
                    <label for="senha" class="obrigatorio">Senha</label>
                    <input type="password" id="senha" name="senha" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn-salvar">Entrar</button>
                <p id="status-msg" role="status"></p>
            </form>

            <p class="auth-rodape">
                Ainda não tem conta? <a href="autocadastro.html">Cadastre-se</a>
            </p>

        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/login.js"></script>
    <script src="js/area-membro.js"></script>

</body>
</html>
