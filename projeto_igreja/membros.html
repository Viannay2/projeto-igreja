<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membros — Sistema de Gestão da Igreja</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
    <a href="#conteudo-principal" class="skip-link">Pular para o conteúdo</a>

    <div class="container">

        <aside class="sidebar">
            <div class="logo"><i class="fa-solid fa-church"></i>
                <h2>Igreja</h2>
            </div>
            <nav>
                <a href="index.html" class="active" aria-current="page"><i class="fa-solid fa-house"></i>Dashboard</a>

                <a href="membros.html"><i class="fa-solid fa-users"></i>Membros</a>

                <a href="família.html"><i class="fa-solid fa-people-roof"></i></i>
                Famílias</a>
                

                <a href="evento.html"><i class="fa-solid fa-calendar-days"></i>
                Eventos</a>

                <a href="ministério.html">
                <i class="fa-solid fa-cross"></i>
                Ministérios</a>

                <a href="visitante.html"><i class="fa-solid fa-user-plus"></i>
                Visitantes</a>

                <a href="relatório.html"><i class="fa-solid fa-file-pdf"></i>
                Relatórios</a>

                <a href="config.html">
                <i class="fa-solid fa-gear"></i>
                Configurações</a>

            </nav>
        </aside>

        <main id="conteudo-principal">

            <header>
                <h1>Membros</h1>

                <div class="topo">
                    <input type="search" placeholder="Pesquisar membro..." aria-label="Pesquisar membro">

                    <button aria-label="Notificações">
                        <i class="fa-solid fa-bell"></i>
                    </button>

                    <img src="imagens/avatar.png" alt="Administrador">
                </div>
            </header>

            <section class="acoes-membros">
                <a href="cadastro.html" class="btn-novo">
                    <i class="fa-solid fa-user-plus"></i>
                    Novo membro
                </a>

                <div class="filtros">
                    <select aria-label="Filtrar por status">
                        <option value="todos">Todos os status</option>
                        <option value="ativo">Ativo</option>
                        <option value="congregando">Congregando</option>
                        <option value="afastado">Afastado</option>
                    </select>
                </div>
            </section>

            <section class="membros">
                <h2>Todos os membros</h2>

                <table>

                    <caption class="sr-only">Lista completa de membros cadastrados</caption>
                  <thead>

                    <tr>
                        <th>Nome</th>
                        <th>Família</th>
                        <th>Status</th>
                        <th>Telefone</th>
                        <th>Ações</th>
                    </tr>
                  <tbody id="tbody-membros">
                  </tbody>

                </table>
            </section>

        </main>

    </div>

   <script src="js/script.js"></script>
   <script src="js/storage.js"></script>
   <script src="js/membro.js"></script>

</body>
</html>
