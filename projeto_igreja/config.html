<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações — Sistema de Gestão da Igreja</title>

    <link rel="stylesheet" href="css/style2.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
    <a href="#conteudo-principal" class="skip-link">Pular para o conteúdo</a>

    <div class="container">

        <aside class="sidebar">
            <div class="logo"><i class="fa-solid fa-church"></i>
                <h2>Igreja</h2>
            </div>
            <nav>
                <a href="index.html" class="active" aria-current="page"><i class="fa-solid fa-house"></i>Dashboard</a>

                <a href="membros.html"><i class="fa-solid fa-users"></i>Membros</a>

                <a href="família.html"><i class="fa-solid fa-people-roof"></i></i>
                Famílias</a>
                

                <a href="evento.html"><i class="fa-solid fa-calendar-days"></i>
                Eventos</a>

                <a href="ministério.html">
                <i class="fa-solid fa-cross"></i>
                Ministérios</a>

                <a href="visitante.html"><i class="fa-solid fa-user-plus"></i>
                Visitantes</a>

                <a href="relatório.html"><i class="fa-solid fa-file-pdf"></i>
                Relatórios</a>

                <a href="config.html">
                <i class="fa-solid fa-gear"></i>
                Configurações</a>

            </nav>
        </aside>

        <main id="conteudo-principal">

            <header>
                <h1>Configurações</h1>

                <div class="topo">
                    <button aria-label="Notificações">
                        <i class="fa-solid fa-bell"></i>
                    </button>

                    <a href="perfil.html">
                        <img src="img.jpg" alt="Administrador">
                    </a>
                </div>
            </header>

            <section class="perfil-topo">
                <div class="avatar-grande">
                    <img src="img.jpg" alt="Logo da igreja" id="logo-preview">
                    <label for="upload-logo" class="btn-trocar-foto">
                        <i class="fa-solid fa-camera"></i>
                        Trocar logo
                    </label>
                    <input type="file" id="upload-logo" accept="image/*" class="sr-only">
                </div>
                <div class="perfil-topo-texto">
                    <h2 id="config-nome-exibicao">Igreja</h2>
                    <p>Essa logo aparece no menu lateral e na barra inferior do celular</p>
                </div>
            </section>

            <section class="form-membro">
                <form id="form-config" novalidate>

                    <fieldset>
                        <legend>Dados da igreja</legend>

                        <div class="campo">
                            <label for="nome_igreja" class="obrigatorio">Nome da igreja</label>
                            <input type="text" id="nome_igreja" name="nome_igreja" required value="Igreja">
                        </div>

                        <div class="campo">
                            <label for="endereco_igreja">Endereço</label>
                            <input type="text" id="endereco_igreja" name="endereco_igreja" placeholder="Rua, número, bairro, cidade">
                        </div>

                        <div class="campo">
                            <label for="telefone_igreja">Telefone de contato</label>
                            <input type="tel" id="telefone_igreja" name="telefone_igreja" placeholder="(11) 91234-5678">
                        </div>

                        <div class="campo">
                            <label for="email_igreja">E-mail de contato</label>
                            <input type="email" id="email_igreja" name="email_igreja" placeholder="contato@igreja.com">
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>Preferências</legend>

                        <div class="campo">
                            <label for="dias_aviso">Avisar sobre eventos importantes com quantos dias de antecedência?</label>
                            <select id="dias_aviso" name="dias_aviso">
                                <option value="15">15 dias</option>
                                <option value="30" selected>30 dias</option>
                                <option value="45">45 dias</option>
                                <option value="60">60 dias</option>
                            </select>
                        </div>
                    </fieldset>

                    <button type="submit" class="btn-salvar">Salvar configurações</button>
                    <p id="status-msg" role="status"></p>
                </form>
            </section>

        </main>

    </div>

    <script src="js/script.js"></script>
    <script src="js/config.js"></script>

</body>
</html>
