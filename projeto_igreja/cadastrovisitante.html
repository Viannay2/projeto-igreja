<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Visitante — Sistema de Gestão da Igreja</title>

    <link rel="stylesheet" href="css/style2.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
    <a href="#conteudo-principal" class="skip-link">Pular para o conteúdo</a>

    <div class="container">

        <aside class="sidebar">
            <div class="logo"><i class="fa-solid fa-church"></i>
                <h2>Igreja</h2>
            </div>
            <nav>
                <a href="index.html"><i class="fa-solid fa-house"></i>Dashboard</a>

                <a href="membros.html"><i class="fa-solid fa-users"></i>Membros</a>

                <a href="família.html"><i class="fa-solid fa-people-roof"></i>
                Famílias</a>

                <a href="evento.html"><i class="fa-solid fa-calendar-days"></i>
                Eventos</a>

                <a href="ministério.html">
                <i class="fa-solid fa-cross"></i>
                Ministérios</a>

                <a href="visitante.html" class="active" aria-current="page"><i class="fa-solid fa-user-plus"></i>
                Visitantes</a>

                <a href="relatório.html"><i class="fa-solid fa-file-pdf"></i>
                Relatórios</a>

                <a href="config.html">
                <i class="fa-solid fa-gear"></i>
                Configurações</a>

            </nav>
        </aside>

        <main id="conteudo-principal">

            <header>
                <h1>Novo Visitante</h1>

                <div class="topo">
                    <a href="visitante.html" class="btn-voltar">
                        <i class="fa-solid fa-arrow-left"></i>
                        Voltar pra lista
                    </a>
                </div>
            </header>

            <section class="form-membro">
                <form id="form-visitante" novalidate>

                    <fieldset>
                        <legend>Dados do visitante</legend>

                        <div class="campo">
                            <label for="nome" class="obrigatorio">Nome completo</label>
                            <input type="text" id="nome" name="nome" required placeholder="Ex: Renata Farias">
                        </div>

                        <div class="campo">
                            <label for="data_visita" class="obrigatorio">Data da visita</label>
                            <input type="date" id="data_visita" name="data_visita" required>
                        </div>

                        <div class="campo">
                            <label for="convidado_por">Convidado por</label>
                            <input type="text" id="convidado_por" name="convidado_por" placeholder="Ex: Maria Sousa">
                            <p class="dica-campo">Qual membro trouxe essa pessoa — não precisa preencher se não souber</p>
                        </div>

                        <div class="campo">
                            <label for="status" class="obrigatorio">Status</label>
                            <select id="status" name="status" required>
                                <option value="">Selecione</option>
                                <option value="ativo">Retornou</option>
                                <option value="congregando">Acompanhando</option>
                                <option value="afastado">Não retornou</option>
                            </select>
                        </div>
                    </fieldset>

                    <button type="submit" class="btn-salvar">Cadastrar visitante</button>
                    <p id="status-msg" role="status"></p>
                </form>
            </section>

        </main>

    </div>

    <script src="js/storage.js"></script>
    <script src="js/cadastro-visitante.js"></script>

</body>
</html>
