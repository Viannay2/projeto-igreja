<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visitantes — Sistema de Gestão da Igreja</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
    <a href="#conteudo-principal" class="skip-link">Pular para o conteúdo</a>

    <div class="container">

        <aside class="sidebar">
            <div class="logo"><i class="fa-solid fa-church"></i>
                <h2>Igreja</h2>
            </div>
            <nav>
                <a href="index.html"><i class="fa-solid fa-house"></i>Dashboard</a>

                <a href="membros.html"><i class="fa-solid fa-users"></i>Membros</a>
                <a href="eventos.html"><i class="fa-solid fa-calendar-days"></i>
                Eventos</a>

                <a href="ministério.html">
                <i class="fa-solid fa-cross"></i>
                Ministérios</a>

                <a href="visitante.html" class="active" aria-current="page"><i class="fa-solid fa-user-plus"></i>
                Visitantes</a>

                <a href="calendario.html"><i class="fa-solid fa-calendar-check"></i>
                Calendário</a>

                <a href="relatório.html"><i class="fa-solid fa-file-pdf"></i>
                Relatórios</a>

                <a href="configuracoes.html">
                <i class="fa-solid fa-gear"></i>
                Configurações</a>

            </nav>
        </aside>

        <main id="conteudo-principal">

            <header>
                <h1>Visitantes</h1>

                <div class="topo">
                    <input type="search" placeholder="Pesquisar visitante..." aria-label="Pesquisar visitante">

                    <a href="perfil.html">
                        <img src="imagens/avatar.png" alt="Administrador">
                    </a>
                </div>
            </header>

            <section class="acoes-membros">
                <a href="cadastrovisitante.html" class="btn-novo">
                    <i class="fa-solid fa-plus"></i>
                    Novo visitante
                </a>
            </section>

            <section class="membros">
                <h2>Últimos visitantes</h2>

                <table>

                    <caption class="sr-only">Lista de visitantes recentes</caption>
                  <thead>

                    <tr>
                        <th>Nome</th>
                        <th>Data da visita</th>
                        <th>Convidado por</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                  </thead>

                  <tbody id="tbody-visitantes"></tbody>

                </table>
            </section>

        </main>

    </div>

    <script src="js/api.js"></script>
    
    <script src="js/visitantes.js"></script>

</body>
</html>
